# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  # Local hook: uses the repo's own prettier (devDependencies) + liquid plugin,
  # so formatting matches CI's `npx prettier . --check` exactly.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx prettier --write
        language: system
        files: \.(md|markdown|html|yml|yaml|json|js)$|(^|/)\.all-contributorsrc$
